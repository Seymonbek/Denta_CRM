# =============================================================================
# pytest configuration for the DentaCRM backend.
#
# Real test suites (T25) live under ``tests/`` and per-app ``tests/`` dirs.
# =============================================================================
[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
testpaths = tests
norecursedirs = .* venv env node_modules management
python_files = test_*.py *_test.py tests.py
addopts = -ra --strict-markers --strict-config
filterwarnings =
    ignore::DeprecationWarning

