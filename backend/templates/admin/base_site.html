{% extends "unfold/layouts/base.html" %}
{% load static %}

{% block extrahead %}
  {{ block.super }}
  <style>
    /* Global Color Scheme Fix for Dark Mode native selects & dropdown popups */
    html.dark,
    html.dark body,
    html.dark select,
    html.dark option,
    html.dark optgroup,
    html.dark input,
    html.dark textarea,
    html.dark [role="listbox"],
    html.dark [role="combobox"] {
      color-scheme: dark !important;
    }

    html.dark select,
    html.dark select option,
    html.dark select optgroup {
      background-color: #0f172a !important;
      color: #f8fafc !important;
    }

    html.dark select option:hover,
    html.dark select option:focus,
    html.dark select option:active,
    html.dark select option:checked {
      background-color: #1e293b !important;
      color: #38bdf8 !important;
    }

    select option {
      background-color: #0f172a !important;
      color: #f8fafc !important;
    }
  </style>
{% endblock %}
