name: DentaCRM CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # 1. Continuous Integration: Test Backend & Frontend
  # =========================================================================
  ci:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Frontend Build Check ---
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Frontend (TypeScript & Vite)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1/
        run: npm run build

      # --- Backend Test Check ---
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run Backend Unit Tests (Pytest)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DJANGO_SECRET_KEY: test-secret-key-for-ci-cd-pipeline-minimum-50-characters-long
          DATABASE_URL: sqlite:////tmp/ci_test.db
        run: |
          pytest -q --disable-warnings tests/test_payments.py tests/test_treatments.py tests/test_inventory.py tests/test_doctors.py

  # =========================================================================
  # 2. Continuous Deployment: Auto-deploy to AWS EC2
  # =========================================================================
  deploy:
    name: Auto-Deploy to AWS EC2
    needs: [ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.AWS_SSH_KEY || secrets.DENTA }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            echo "🚀 [CI/CD] Serverga yangi kod yuklanmoqda..."
            cd ~/Denta_CRM || cd /home/ubuntu/Denta_CRM
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy.sh
            ./deploy.sh
            echo "✅ [CI/CD] Muvaffaqiyatli deploy qilindi!"
